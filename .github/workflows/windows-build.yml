name: Windows Build

on:
  push:
    branches:
      - main
      - fix/v0.4.1-dock-stability
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build AI Dock for Windows
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare portable executable
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/ai-dock.exe" "src-tauri/target/release/AI-Dock-Portable.exe"

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ai-dock-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/AI-Dock-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/AI-Dock-Portable.exe
