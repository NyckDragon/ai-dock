name: Linux Build

# Builds the Linux AppImage on main, on version tags, on pull requests to main and
# on demand. Ubuntu 22.04 keeps the glibc floor at 2.35, so the AppImage also runs
# on older distributions. Publishing is a separate step.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # linuxdeploy's strip does not understand newer ELF sections.
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libfuse2 patchelf squashfs-tools xvfb xauth openbox dbus-x11 xdotool
          getconf GNU_LIBC_VERSION

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend logic tests
        run: npm run test:frontend

      - name: Build the frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build AI Dock for Linux
        run: npm run tauri:build -- --bundles appimage

      # The AppImage catalog runs AppRun under firejail as another user, so both
      # launchers must be readable and executable by everyone (catalog PR #8937).
      - name: Check AppImage launcher permissions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          (( ${#images[@]} == 1 ))
          image="${images[0]}"
          chmod +x "$image"
          offset="$("$image" --appimage-offset)"
          listing="$(unsquashfs -lln -o "$offset" "$image" AppRun AppRun.wrapped)"
          printf '%s\n' "$listing"
          for launcher in AppRun AppRun.wrapped; do
            mode="$(printf '%s\n' "$listing" | awk -v name="/$launcher" '$NF ~ name "$" { print $1 }')"
            if [[ -z "$mode" || "${mode:7:1}" != "r" || "${mode:9:1}" != "x" ]]; then
              echo "$launcher is not readable and executable by everyone (${mode:-missing})." >&2
              exit 1
            fi
          done
          sha256sum "$image"

      # A plain X11 session, not Hyprland: it proves the AppImage starts and opens
      # its window, not how the dock behaves on Omarchy.
      - name: Start the AppImage under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          image="$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
            set -euo pipefail
            openbox >/tmp/openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 2
            WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 "$1" >/tmp/ai-dock.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 15); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "AI Dock exited before opening a window." >&2
                cat /tmp/ai-dock.log >&2
                exit 1
              fi
              if xdotool search --name "AI Dock" >/dev/null 2>&1; then
                echo "AI Dock opened its window."
                exit 0
              fi
              sleep 2
            done
            echo "AI Dock opened no window in 30 seconds." >&2
            cat /tmp/ai-dock.log >&2
            exit 1
          ' bash "$image"

      - name: Upload Linux build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-dock-linux-${{ github.sha }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
