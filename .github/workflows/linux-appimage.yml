name: Linux AppImage compatibility

# Build a test artifact only; publishing a Linux beta remains a separate decision.
on:
  pull_request:
    paths:
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Work around legacy linuxdeploy stripping problems.
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            squashfs-tools \
            xvfb \
            xauth \
            openbox \
            dbus-x11 \
            xdotool
          getconf GNU_LIBC_VERSION

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux AppImage (Tauri 2.12+)
        # Windows uses icon.ico; Linux AppImage needs a square PNG.
        run: npm run tauri:build -- --bundles appimage --config '{"bundle":{"icon":["icons/icon.png"]}}'

      - name: Validate AppImage launcher permissions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if (( ${#images[@]} != 1 )); then
            echo "Expected one AppImage, found ${#images[@]}." >&2
            exit 1
          fi
          image="${images[0]}"
          chmod +x "$image"
          offset="$("$image" --appimage-offset)"
          if [[ ! "$offset" =~ ^[0-9]+$ ]]; then
            echo "Could not determine SquashFS offset: $offset" >&2
            exit 1
          fi

          # Inspect the modes stored in SquashFS. --appimage-extract may
          # recreate files with different modes and hide this regression.
          listing="$(unsquashfs -lln -o "$offset" "$image" AppRun AppRun.wrapped)"
          printf '%s\n' "$listing"
          for launcher in AppRun AppRun.wrapped; do
            mode="$(printf '%s\n' "$listing" | awk -v name="/$launcher" '$NF ~ name "$" { print $1 }')"
            if [[ -z "$mode" ]]; then
              echo "Missing bundled launcher: $launcher" >&2
              exit 1
            fi
            if [[ "${mode:7:1}" != "r" || "${mode:9:1}" != "x" ]]; then
              echo "Non-owner users cannot read/execute $launcher ($mode)." >&2
              exit 1
            fi
          done
          sha256sum "$image"

      - name: Smoke-test application window under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          (( ${#images[@]} == 1 ))
          image="$(realpath "${images[0]}")"
          chmod +x "$image"
          # This is a generic X11 smoke test; it is not a substitute for
          # testing on Omarchy/Hyprland, the currently supported Linux desktop.
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
            set -euo pipefail
            openbox >/tmp/ai-dock-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 2
            WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 "$1" >/tmp/ai-dock-smoke.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
            for n in $(seq 1 15); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "AI Dock exited before presenting a window" >&2
                cat /tmp/ai-dock-smoke.log >&2
                exit 1
              fi
              if xdotool search --name "AI Dock" >/dev/null 2>&1; then
                echo "AI Dock started and created a window under Xvfb."
                exit 0
              fi
              sleep 2
            done
            echo "AI Dock did not expose an X11 window within 30 seconds" >&2
            cat /tmp/ai-dock-smoke.log >&2
            exit 1
          ' bash "$image"

      - name: Upload test AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-dock-linux-appimage-test
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
